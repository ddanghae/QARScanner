<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRT + TBS UI 검증 · 가상 데이터</title>
<link rel="stylesheet" href="../css/style.css">
<body style="padding:16px">
  <h1>CRT + TBS UI 검증 · 가상 데이터</h1>
  <p>실제 시세가 아닌 고정된 테스트 사례입니다.</p>
  <label><input type="checkbox" id="filter-crt-tbs"> CRT + TBS 확인만</label>
  <button id="short-case" class="btn">숏 사례</button>
  <button id="expire-case" class="btn">만료 동작 테스트</button>
  <div id="status-bar"></div><div id="results"></div><div id="detail-panel" class="detail-overlay" aria-hidden="true"></div>
  <p id="qa-status">준비 중</p>
  <script type="module">
    import { crtFixture } from './crt-tbs.test.js';
    import { evaluateCrtTbs } from '../js/core/crt-tbs.js';
    import { state } from '../js/state.js';
    import { initDashboard, renderResults } from '../js/ui/dashboard.js';
    import { initDetailPanel, showDetail } from '../js/ui/detail-panel.js';
    const f = crtFixture();
    const crtTbs = evaluateCrtTbs(f.h4, f.m5, { now: f.now });
    const row = { symbol:'TESTUSDT', scanMode:'reversal', rank:1, direction:'long', score:55,
      grade:{key:'strong'}, stage:{stage:3,label:'구조전환',badge:'blue'}, price:103, change6h:-2,
      quoteVolume:50000000, topSignals:['가상 데이터 · CRT LONG 확인'], absorption:{label:'테스트'},
      plan:{entry:103,invalidation:98,tp1:110,tp2:120,tp3:125,riskReward:3.4,rrText:'1 : 3.4'},
      breakdown:[],penalties:[],crtTbs };
    state.settings = {...state.settings, scanMode:'reversal',direction:'both',minScore:20,stageFilter:'all',
      crtTbsOnly:false,goldenCrossOnly:false,near1hEma200Only:false,filterNoise:false,showFavoritesOnly:false,
      excludeChaseBan:false,excludeNewListing:false,excluded:[],seedMoney:0};
    state.results = [row, {...row,symbol:'CONFLICTUSDT',direction:'short'}];
    initDetailPanel(); initDashboard();
    document.getElementById('filter-crt-tbs').addEventListener('change', e => {
      state.settings.crtTbsOnly = e.target.checked; renderResults();
    });
    document.getElementById('short-case').addEventListener('click', () => {
      const mirror = c => ({...c,open:220-c.open,close:220-c.close,high:220-c.low,low:220-c.high});
      showDetail({...row,direction:'short',price:117,topSignals:['가상 데이터 · CRT SHORT 확인'],
        plan:{entry:117,invalidation:122,tp1:110,tp2:100,tp3:95,riskReward:3.4,rrText:'1 : 3.4'},
        crtTbs:evaluateCrtTbs(f.h4.map(mirror),f.m5.map(mirror),{now:f.now})});
    });
    document.getElementById('expire-case').addEventListener('click', () => {
      row.crtTbs = {...crtTbs, range:{...crtTbs.range, expiresAt:Date.now()+1500}};
      state.results = [row]; renderResults(); showDetail(row);
    });
    window.addEventListener('error', e => { document.getElementById('qa-status').textContent = e.message; });
    document.getElementById('qa-status').textContent = '화면 초기화 완료';
  </script>
</body>
</html>
